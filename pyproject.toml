# ABOUTME: Packaging, dependency and tool configuration for cronos-extract.
# ABOUTME: Builds with uv_build and configures ruff, ty and pytest.

[project]
name = "cronos-extract"
version = "0.1.0.dev0"
description = "Extract data from CronosPro databases, including password-protected ones."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    { name = "Willem Hengeveld", email = "itsme@xs4all.nl" },
    { name = "Dirk Engling", email = "erdgeist@erdgeist.org" },
    { name = "Ben Hammersley", email = "ben@hammersleyfutures.com" },
]
keywords = ["cronos", "cronospro", "database", "export", "forensics"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Utilities",
]
dependencies = ["jinja2>=3.1.6"]

[project.urls]
Homepage = "https://github.com/hammersleyfutures/cronos-extract"
Issues = "https://github.com/hammersleyfutures/cronos-extract/issues"

[project.scripts]
cronos-extract = "cronos_extract.cli:main"
crodump = "cronos_extract.crodump:main"
croconvert = "cronos_extract.croconvert:main"

[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
    "ty>=0.0.81",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "RET501", "RET502", "RET503"]

[tool.ty.rules]
all = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not realdata"]
markers = [
    "realdata: reads the real databases listed in the git-ignored local/mash_datasets_with_CroIndex_dat.txt; run with -m realdata",
]
filterwarnings = ["error"]
