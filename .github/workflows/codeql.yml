# ABOUTME: GitHub Actions workflow that runs CodeQL security-and-quality analysis on the Python code.
# ABOUTME: Runs on pushes to master, on pull requests and once a week.
name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: github/codeql-action/init@v4.38.0
        with:
          languages: python
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4.38.0
